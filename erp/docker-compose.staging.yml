# 스테이징 구성 — staging.sjfire.co.kr (프로덕션 Caddy를 공유, 별도 체크아웃에서 실행)
# 위치: /home/ubuntu/woni-staging/erp (staging 브랜치 체크아웃)
# 실행: sudo docker compose -f docker-compose.staging.yml up -d --build
# 주의: 프로덕션 배포 빌드와 동시에 돌리지 말 것 (4GB 램 — 메모리 스파이크)
# 전제(A5 2026-10-02): 운영 compose가 만든 erp_staging_edge 네트워크가 있어야 한다(아래 networks 주석).
name: erp-staging

# ⚠️ 서비스명은 반드시 'app'이 아닌 'staging' 유지 — 프로덕션 compose도 서비스명 'app'이라,
#    같은 외부 네트워크(erp_default)에 'app' 별칭이 중복되면 Caddy의 sjfire.co.kr(app:3000)이
#    스테이징 컨테이너로도 라운드로빈되어 운영에 스테이징 데이터가 새는 사고 발생(2026-07-13).
services:
  staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: erp-staging-app
    expose:
      - "3000"          # 외부 직접 노출 없음 — 프로덕션 Caddy 경유만
    env_file:
      - .env.staging    # 스테이징 Supabase(nwflnzugwylhpdyodyog) 키 — 서버에만 존재, 커밋 금지
      # 주의: Next 빌드는 .env.production을 읽으므로 이 체크아웃에는
      #       .env.staging을 .env.production으로도 복사해둬야 함 (cp .env.staging .env.production)
    environment:
      - NODE_ENV=production
      - TZ=Asia/Seoul
    restart: always
    # A5(2026-10-02) — 운영보다 작게. 운영 빌드와 같은 VPS(3.9GB)를 쓰므로 스테이징이 운영을 밀어내지 않게.
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # A5 — 운영 네트워크(erp_default)에서 빠진다. Caddy와는 erp_staging_edge 다리로만 닿고,
    #   gotenberg-staging과는 이 compose의 default에서 닿는다. 운영 app·gotenberg-prod는 더 이상 보이지 않는다.
    networks:
      - default
      - edge

  # xlsx→PDF 변환 (P32-1) — LibreOffice 기반. 앱이 http://gotenberg-staging:3000 으로 호출.
  # ⚠️ 고유 이름 유지 — 운영에도 gotenberg 추가 시 별칭 충돌 방지(2026-07-13 인시던트 교훈).
  # ⚠ 패치까지 고정 — 운영(docker-compose.prod.yml)과 **같은 버전**을 쓴다.
  #   스테이징이 다른 버전을 보면 '여기선 됐는데'가 성립해 검증이 무의미해진다.
  gotenberg-staging:
    image: gotenberg/gotenberg:8.36.0
    container_name: gotenberg-staging
    command:
      - gotenberg
      - --api-timeout=120s
    restart: always
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # A5 — Caddy 다리에도 붙지 않는다(외부에서 닿을 이유가 없다). 스테이징 앱과만 이 compose의 default에서 만난다.
    networks:
      - default

networks:
  # A5(2026-10-02) — 종전엔 운영 네트워크(erp_default)에 external로 합류했다(운영 app·gotenberg-prod가 서로 보임,
  #   2026-07-13 'app' 별칭 혼입 사고의 토대). 이제 Caddy 전용 다리에만 합류한다.
  #   ⚠ 이 네트워크는 **운영 compose가 만든다**(caddy의 networks). 운영을 A5 판으로 한 번 up 한 뒤에만
  #     스테이징을 올릴 수 있다 — 순서가 바뀌면 "network erp_staging_edge declared as external, but could not be found".
  edge:
    external: true
    name: erp_staging_edge
